name: Android event widget
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Reuse development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pc-widget-development-signing-v1
      - name: Test, lint and assemble
        working-directory: android-widget
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: party-crashers-widget-debug
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
